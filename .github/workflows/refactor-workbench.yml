name: Verify and apply app split
on:
  push:
    branches: [refactor/extract-tag-manager]
    paths: [.github/workflows/refactor-workbench.yml, '.refactor/**']
permissions:
  contents: write
concurrency:
  group: isolated-app-extraction
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: working
      - uses: actions/checkout@v4
        with:
          repository: shurli/immich-person-review
          ref: 724b58b8343b6b3f425ec51d92ab00fd96eb2aac
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract without changing person and face implementations
        shell: bash
        run: |
          python working/.refactor/split.py --source baseline --person-out "$RUNNER_TEMP/split/person" --tag-out "$RUNNER_TEMP/split/tag"
          for app in person tag; do
            (cd "$RUNNER_TEMP/split/$app" && npm ci --ignore-scripts --no-audit --no-fund && npm test && npm run check) | tee "$RUNNER_TEMP/split/$app-tests.txt"
          done
      - name: Browser regression with simulated Immich
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/pip" install --quiet playwright
          "$RUNNER_TEMP/playwright/bin/playwright" install --with-deps chromium
          SPLIT_ROOT="$RUNNER_TEMP/split" "$RUNNER_TEMP/playwright/bin/python" working/.refactor/browser_check.py
      - name: Build both independent Docker images
        shell: bash
        run: |
          docker build -t split-person "$RUNNER_TEMP/split/person"
          docker build -t split-tag "$RUNNER_TEMP/split/tag"
          docker run --rm --entrypoint node split-person --check server.mjs
          docker run --rm -d --name split-tag-smoke -p 127.0.0.1:3039:3000 split-tag
          trap 'docker logs split-tag-smoke; docker rm -f split-tag-smoke || true' EXIT
          curl --retry 15 --retry-delay 1 --retry-all-errors --retry-max-time 30 --max-time 5 --fail http://127.0.0.1:3039/healthz
          curl --fail http://127.0.0.1:3039/tag-api/tags | python -c 'import json,sys; d=json.load(sys.stdin); assert len(d["document"]["concepts"]) == 350'
      - name: Commit only the verified person app to the feature branch
        working-directory: working
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm --ignore-unmatch public/tags.js data/tags.json tag-calibration.mjs tag-calibration.test.mjs
          rsync -a --exclude=node_modules/ "$RUNNER_TEMP/split/person/" ./
          git add -A -- . ':!.github' ':!.refactor'
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: separate tag management and preserve person and face workflows'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Package verified standalone sources
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/split"
          for app in person tag; do
            if test -d "$RUNNER_TEMP/split/$app"; then
              tar --exclude=node_modules -czf "$RUNNER_TEMP/split/$app-source.tar.gz" -C "$RUNNER_TEMP/split/$app" .
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-app-split
          retention-days: 7
          path: |
            ${{ runner.temp }}/split/*-source.tar.gz
            ${{ runner.temp }}/split/*-tests.txt
            ${{ runner.temp }}/split/*-report.json
            ${{ runner.temp }}/split/*.png
