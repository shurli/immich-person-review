services:
  immich-tag-manager:
    build: .
    image: immich-tag-manager:0.1.0
    container_name: immich-tag-manager
    restart: unless-stopped
    ports:
      - "${TAG_MANAGER_PORT:-3031}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      TAG_TAXONOMY_PATH: /app/storage/tags.json
      TAG_TAXONOMY_DEFAULT_PATH: /app/defaults/tags.json
    volumes:
      - tag-taxonomy:/app/storage
    networks:
      - immich
volumes:
  tag-taxonomy:
    name: ${TAG_TAXONOMY_VOLUME:-immich-tag-manager-data}
networks:
  immich:
    external: true
    name: ${IMMICH_NETWORK:-immich_default}
