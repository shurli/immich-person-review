services:
  immich-person-review:
    build: .
    image: immich-person-review:0.8.0
    container_name: immich-person-review
    restart: unless-stopped
    ports:
      - "3030:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      # Standardmaessig nutzt Immich /api.
      IMMICH_API_PREFIX: "${IMMICH_API_PREFIX:-/api}"
