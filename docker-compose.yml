services:
  immich-person-review:
    build: .
    image: immich-person-review:0.12.2
    container_name: immich-person-review
    restart: unless-stopped
    ports:
      - "3030:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      TAG_TAXONOMY_PATH: /app/storage/tags.json
      TAG_TAXONOMY_DEFAULT_PATH: /app/defaults/tags.json
    volumes:
      - tag-taxonomy:/app/storage
    networks:
      - immich

volumes:
  tag-taxonomy:

networks:
  immich:
    external: true
    name: immich_default
