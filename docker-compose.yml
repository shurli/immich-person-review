services:
  immich-person-review:
    build: .
    image: immich-person-review:local
    container_name: immich-person-review
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      IMMICH_URL: "http://immich-server:2283"
      IMMICH_API_KEY: "${IMMICH_API_KEY}"
      PORT: "3000"
      # Optional: URL prefix if your Immich endpoint already includes /api.
      IMMICH_API_PREFIX: "/api"
